id = "chalk-lsp"
name = "Chalk"
description = "Chalk language intelligence for Python and SQL resolvers"
version = "0.1.0"
schema_version = 1
authors = ["Chalk AI, Inc. <support@chalk.ai>"]
repository = "https://github.com/chalk-ai/chalk-zed"
capabilities = [
  { kind = "download_file", host = "artifactregistry.googleapis.com", path = ["**"] },
]

[grammars.sql]
repository = "https://github.com/DerekStride/tree-sitter-sql"
commit = "851e9cb257ba7c66cc8c14214a31c44d2f1e954e"

[grammars.yaml]
repository = "https://github.com/zed-industries/tree-sitter-yaml"
commit = "baff0b51c64ef6a1fb1f8390f3ad6015b83ec13a"

[language_servers.chalk-lsp]
name = "Chalk Language Server"
languages = ["Python", "Chalk SQL", "Chalk YAML"]
